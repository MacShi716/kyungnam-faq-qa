  <script>
  const FAQ_DATA = [{"id":"F01","question_ko":"휴학 신청은 언제 해요?|휴학하려면 어떻게 해야 돼?|휴학 신청 기간이 언제인가요|일반휴학은 몇 학기까지 가능해요","question_zh":"什么时候可以申请休学？|办理休学的流程是什么？","answer":"일반휴학은 학생이 학과(부) 또는 학사관리팀에 방문 신청하고 지도교수 상담 후 접수하며, 학사관리팀이 최종 승인합니다. 소정의 기간부터 수업일수 1/3선까지 신청할 수 있고(학기 개시일 이후에는 등록을 마친 학생만 허가), 입학한 첫 학기에는 일반휴학을 할 수 없습니다. 휴학은 1회에 2개 학기를 초과할 수 없고 통산 3년(신입생은 6학기)을 넘을 수 없습니다. 학기별 신청 기간·제출서류는 학사공지를 확인하세요(문의: 학사관리팀 055-249-2495).","answer_zh":"一般休学须由学生到系(部)或学事管理组当面申请，经指导教授面谈后受理，最终由学事管理组批准。可从规定期间起申请至授课日数的1/3为止（学期开始日之后仅限已完成注册的学生获批），入学后的第一个学期不能办理一般休学。一次休学不得超过2个学期，累计不得超过3年（新生为6个学期）。各学期的申请期间和所需材料请查看学事公告（咨询：学事管理组 055-249-2495）。","source":"휴학 안내(경남대학교 학적) https://www.kyungnam.ac.kr/ko/4401/subview.do ; 2026학년도 1학기 등록금 최종 납부 안내(연락처 표) https://www.kyungnam.ac.kr/bbs/ko/1398/107845/download.do","checked_at":"","tags":["휴학","休学","쉬는학기","休学申请","일반휴학","学籍"],"terms_ko":["휴학 신청은 언제 해요?","휴학하려면 어떻게 해야 돼?","휴학 신청 기간이 언제인가요","일반휴학은 몇 학기까지 가능해요","휴학","休学","쉬는학기","休学申请","일반휴학","学籍"],"terms_zh":["什么时候可以申请休学？","办理休学的流程是什么？","휴학","休学","쉬는학기","休学申请","일반휴학","学籍"]},{"id":"F02","question_ko":"복학 신청 어떻게 해요?|복학 절차 알려주세요|복학 신청 기간이 언제예요|조기복학은 어떻게 해요","question_zh":"怎么申请复学？|提前复学怎么办理？","answer":"휴학한 학생은 기간이 만료되거나 휴학 사유가 종료되면 복학원을 제출하고 학부장을 거쳐 총장의 허가를 받아 복학합니다. 복학 시기는 매 학기 2월(1학기)·8월(2학기)이며 별도 홈페이지 공지로 안내되고, 당해 학기 복학예정자는 학생정보시스템 또는 학과(부)에 신청하면 학사관리팀이 접수·승인합니다(제대복학자는 전역증 사본 1부 필요). 조기 복학은 먼저 신청해 학사관리팀이 복학 학기를 조정한 뒤 다시 복학신청을 해야 합니다. 복학신청을 하지 않으면 수강을 해도 학기인정을 받을 수 없으니, 등록금 납부·수강신청을 했더라도 복학신청은 꼭 해야 합니다.","answer_zh":"休学的学生在休学期间届满或休学事由结束后，须提交复学申请书，经学部长报总长批准后复学。复学时间为每学期2月（第1学期）、8月（第2学期），另行在学校网站公告；当学期预定复学者可在学生信息系统或系（部）申请，由学事管理组受理并批准（退伍复学者需提交退伍证复印件1份）。提前复学须先申请，由学事管理组调整复学学期后，再提交复学申请。未提交复学申请的话，即使上课也无法获得学期认定，因此即使已缴学费、已选课，也必须办理复学申请。","source":"복학 https://www.kyungnam.ac.kr/ko/4402/subview.do","checked_at":"","tags":["복학","复学","돌아오기","조기복학","复学申请","복학신청"],"terms_ko":["복학 신청 어떻게 해요?","복학 절차 알려주세요","복학 신청 기간이 언제예요","조기복학은 어떻게 해요","복학","复学","돌아오기","조기복학","复学申请","복학신청"],"terms_zh":["怎么申请复学？","提前复学怎么办理？","복학","复学","돌아오기","조기복학","复学申请","복학신청"]},{"id":"F03","question_ko":"졸업하려면 학점 몇 개 들어야 해요?|졸업 요건이 어떻게 돼요?|졸업 학점이 학과마다 달라요","question_zh":"毕业需要多少学分？","answer":"졸업 여부는 졸업심사에서 결정되며, 심사 항목은 주전공 졸업학점 이수 여부, 과정별(교양/전공) 이수학점, 이수구분별 이수학점, 사범대 교직과목, 부전공·복수전공 이수입니다. 일부 학과는 졸업필수과목이 있습니다(예: 미술교육과 졸업전시). 본인의 이수현황은 학생정보시스템의 전공취득정보에서 확인할 수 있으며, 졸업에 필요한 구체적인 학점 수는 학과 교육과정 또는 학생정보시스템에서 확인하세요.","answer_zh":"是否可以毕业由毕业审查决定，审查项目包括：主修专业毕业学分是否修满、各课程类别（教养/专业）修读学分、各修读区分修读学分、师范学院教职科目、辅修·双专业。部分院系有毕业必修科目（例如美术教育系的毕业展）。本人的修读情况可在学生信息系统的“专业取得信息”中查看；毕业所需的具体学分数请在所属院系课程设置或学生信息系统中确认。","source":"졸업 https://www.kyungnam.ac.kr/ko/4407/subview.do","checked_at":"","tags":["졸업","毕业","학점","学分","졸업요건","졸업학점","毕业学分"],"terms_ko":["졸업하려면 학점 몇 개 들어야 해요?","졸업 요건이 어떻게 돼요?","졸업 학점이 학과마다 달라요","졸업","毕业","학점","学分","졸업요건","졸업학점","毕业学分"],"terms_zh":["毕业需要多少学分？","졸업","毕业","학점","学分","졸업요건","졸업학점","毕业学分"]},{"id":"F04","question_ko":"수강신청은 언제 해요?|수강 신청 기간이 언제인가요|수강신청 어디서 해요|최대 몇 학점까지 들을 수 있어요","question_zh":"什么时候选课？|怎么选课？","answer":"수강신청은 방학 중 지정 기간에 하며(홈페이지 공고), 대상은 재학생과 당해 학기 복학예정자입니다. 예비수강신청(수강바구니)은 학생정보시스템 → 수업관리 → 수강신청 → 수강바구니에서, 정규 수강신청은 학생정보시스템 → 수업관리 → 수강신청에서 하며 선착순이고 필수과목이 우선입니다. 수강정정 후 폐강될 수 있으니 공지를 확인하세요. 구체적인 일정은 홈페이지 공고를 확인하고, 문의는 학사관리팀 055-249-2480입니다.","answer_zh":"选课在假期中的指定期间进行（学校网站公告），对象为在校生和当学期预定复学者。预选课（选课篮子）在“学生信息系统 → 课程管理 → 选课 → 选课篮子”中申请，正式选课在“学生信息系统 → 课程管理 → 选课”中进行，先到先得，必修科目优先。选课更正后可能出现停开课程，请留意公告。具体日程请查看学校网站公告，咨询：学事管理组 055-249-2480。","source":"수강신청 https://www.kyungnam.ac.kr/ko/4390/subview.do","checked_at":"","tags":["수강신청","选课","수강","课程申请","수강바구니","学分上限","学정시","预选课"],"terms_ko":["수강신청은 언제 해요?","수강 신청 기간이 언제인가요","수강신청 어디서 해요","최대 몇 학점까지 들을 수 있어요","수강신청","选课","수강","课程申请","수강바구니","学分上限","学정시","预选课"],"terms_zh":["什么时候选课？","怎么选课？","수강신청","选课","수강","课程申请","수강바구니","学分上限","学정시","预选课"]},{"id":"F05","question_ko":"성적은 어디서 확인해요?|성적 조회 어떻게 해요|성적 이의신청은 어떻게 해요","question_zh":"在哪里查成绩？|成绩有异议怎么办？","answer":"성적은 매 학기 기말고사 종료 후 홈페이지에 공지되는 지정 기간에 ‘학생정보시스템 → 성적관리 → 채점성적열람및수업평가 → 성적’에서 볼 수 있으며, 해당 과목의 수업평가를 먼저 해야 열람됩니다. 이의가 있으면 성적 열람 기간 중 지정된 이의신청 기간에 성적이의신청서(소정 양식)를 작성해 담당 교강사 소속 학과사무실에 접수하면, 교수가 확인·처리한 뒤 결과를 학생에게 통보합니다.","answer_zh":"成绩在每学期期末考试结束后，于学校网站另行公告的指定期间，通过“学生信息系统 → 成绩管理 → 评分成绩查询及课程评价 → 成绩”查看，需先完成该课程的课程评价才能查看。如有异议，须在成绩查询期间内的指定异议申请期间，填写成绩异议申请书（规定格式）并提交给任课教师所属系办公室，教授核实处理后将结果通知学生。","source":"성적열람 및 이의신청(경남대학교 수업) https://www.kyungnam.ac.kr/ko/4393/subview.do","checked_at":"","tags":["성적","成绩","성적조회","이의신청","成绩查询","채점성적","수업평가"],"terms_ko":["성적은 어디서 확인해요?","성적 조회 어떻게 해요","성적 이의신청은 어떻게 해요","성적","成绩","성적조회","이의신청","成绩查询","채점성적","수업평가"],"terms_zh":["在哪里查成绩？","成绩有异议怎么办？","성적","成绩","성적조회","이의신청","成绩查询","채점성적","수업평가"]},{"id":"F06","question_ko":"장학금은 어떻게 신청해요?|장학금 종류가 뭐가 있어요|국가장학금은 어떻게 받아요","question_zh":"怎么申请奖学金？|奖学金有哪些种类？","answer":"경남대 장학금은 교내장학금(교비로 지급)과 교외장학금(국가·지방자치단체·외부 단체나 개인이 지급)으로 나뉩니다. 국가장학금은 한국장학재단이 소득구간에 따라 차등 지급하며 매 학기 신청해야 합니다. 교내 장학생 선발은 장학금지급규정·시행세칙에 따르니 세부 기준과 신청 시기는 장학 공지를 확인하세요. 문의: 교내장학금 055-249-2033, 국가장학금 2035, 교외장학금·학자금대출 2036.","answer_zh":"庆南大学奖学金分为校内奖学金（由校费支付）和校外奖学金（由国家、地方政府、校外团体或个人支付）。国家奖学金由韩国奖学财团按收入档次差别发放，每学期都需要申请。校内奖学生的选拔依据奖学金支付规定及施行细则，具体标准和申请时间请查看奖学金公告。咨询：校内奖学金 055-249-2033，国家奖学金 2035，校外奖学金及学费贷款 2036。","source":"장학제도 https://www.kyungnam.ac.kr/ko/4415/subview.do","checked_at":"","tags":["장학금","奖学金","등록금감면","국가장학금","校内奖学金","한국장학재단","장학신청"],"terms_ko":["장학금은 어떻게 신청해요?","장학금 종류가 뭐가 있어요","국가장학금은 어떻게 받아요","장학금","奖学金","등록금감면","국가장학금","校内奖学金","한국장학재단","장학신청"],"terms_zh":["怎么申请奖学金？","奖学金有哪些种类？","장학금","奖学金","등록금감면","국가장학금","校内奖学金","한국장학재단","장학신청"]},{"id":"F07","question_ko":"기숙사 신청은 언제 해요?|기숙사 어떻게 들어가요|생활관 비용이 얼마예요","question_zh":"怎么申请宿舍？","answer":"한마생활관은 학업에 전념하고 품행이 단정하며 전염성 질환이 없는 본교 재학생이 입사할 수 있고 신입생을 우선 선발하며, 휴학 중인 학생은 다음 학기 복학예정자만 입사할 수 있습니다. 신입생(수시)은 합격자에 한해 매년 1월 초 온라인 접수, 정시는 입학원서 하단 신청란에 체크하고, 재학생은 학생정보시스템에서 매년 2학기 종료 전 소정 기간에 온라인으로 접수합니다. 입사허가통지서를 받으면 생활관비를 납부한 뒤 입사등록을 합니다. 2026학년도 2학기 관리비는 제1한마생활관(남) 819,000원, 제2(여) 834,000원, 제3(여) 895,000원, 건화아파트(군사<남>) 533,000원이고, 식비는 1식 301,500원·2식 573,000원입니다. 문의: 한마생활관 행정실 055-249-2260, 2261.","answer_zh":"汉马生活馆可供专注学业、品行端正、无传染性疾病的本校在读生入住，优先录取新生；休学中的学生仅限下学期预定复学者可入住。新生（随时招生）仅限合格者，每年1月初网上申请；正式招生者在入学申请表下方的申请栏勾选；在校生通过学生信息系统，在每年第2学期结束前的规定期间网上申请。收到入住许可通知书后，缴纳生活馆费用再办理入住登记。2026学年度第2学期管理费：第1汉马生活馆（男）819,000韩元，第2（女）834,000韩元，第3（女）895,000韩元，健和公寓（军事<男>）533,000韩元；伙食费为1餐301,500韩元、2餐573,000韩元。咨询：汉马生活馆行政室 055-249-2260、2261。","source":"입사안내 https://www.kyungnam.ac.kr/dorm/1553/subview.do ; 2026학년도 2학기 관리비(중도 입사자 및 퇴사자 환불)내역 안내 https://www.kyungnam.ac.kr/dorm/3170/subview.do ; 안내전화 https://www.kyungnam.ac.kr/dorm/2898/subview.do","checked_at":"","tags":["기숙사","宿舍","생활관","입사","한마생활관","宿舍费用","退舍"],"terms_ko":["기숙사 신청은 언제 해요?","기숙사 어떻게 들어가요","생활관 비용이 얼마예요","기숙사","宿舍","생활관","입사","한마생활관","宿舍费用","退舍"],"terms_zh":["怎么申请宿舍？","기숙사","宿舍","생활관","입사","한마생활관","宿舍费用","退舍"]},{"id":"F08","question_ko":"등록금은 언제 내요?|등록금 납부 기간 알려주세요|등록금 어떻게 내요|등록금 고지서는 어디서 출력해요","question_zh":"学费什么时候交？|学费怎么缴纳？","answer":"등록금납입통지서는 학생정보시스템에서 출력하고(우편 발송 없음), 경남은행·농협은행 전국 지점 또는 개인별 가상계좌로 납부합니다. 2026학년도 1학기 재학생 최종등록 기간은 2026.3.25(수)~3.27(금) 09:00~16:00였고, 실납부액이 0원이면 학생정보시스템에서 ‘등록금 결재’를 클릭해 등록합니다. 가상계좌는 토·일·공휴일과 은행 전산 점검 시간에는 납부할 수 없습니다. 이번 학기 납부 기간은 등록 안내 공지를 확인하세요(문의: 재무회계팀 055-249-2475, 2058).","answer_zh":"学费缴纳通知书需在学生信息系统中打印（不邮寄），可到庆南银行、农协银行全国各分行或通过个人专属虚拟账户缴纳。2026学年度第1学期在校生最终注册期间为2026.3.25（周三）~3.27（周五）09:00~16:00；实际应缴金额为0韩元的学生，在学生信息系统点击“学费结算”即可完成注册。虚拟账户在周六、周日、公休日及银行系统检修时间无法缴费。本学期的缴费期间请查看注册通知公告（咨询：财务会计组 055-249-2475、2058）。","source":"2026학년도 1학기 등록금 최종 납부 안내 https://www.kyungnam.ac.kr/bbs/ko/1398/107845/download.do","checked_at":"","tags":["등록금","学费","납부","고지서","가상계좌","缴费","등록금납입통지서"],"terms_ko":["등록금은 언제 내요?","등록금 납부 기간 알려주세요","등록금 어떻게 내요","등록금 고지서는 어디서 출력해요","등록금","学费","납부","고지서","가상계좌","缴费","등록금납입통지서"],"terms_zh":["学费什么时候交？","学费怎么缴纳？","등록금","学费","납부","고지서","가상계좌","缴费","등록금납입통지서"]},{"id":"F09","question_ko":"비자 연장은 어떻게 해요?|체류기간 연장 신청 방법|비자 연장은 언제부터 신청할 수 있어요","question_zh":"怎么续签签证？|延长滞留期间怎么办理？","answer":"체류기간 연장은 체류기간 만료 4개월 전부터 만료 당일(전자민원은 만료 전일)까지 신청할 수 있습니다. 체류 민원은 하이코리아(www.hikorea.go.kr)에서 사전 방문예약이 필요하고, 공통서류는 통합신청서(별지 34호 서식)·여권·외국인등록증·체류지 입증서류이며 체류자격별 추가서류는 하이코리아 ‘체류자격별 안내매뉴얼’ 또는 1345(외국인종합안내센터)에서 확인합니다. 학교의 비자·외국인등록증 업무 문의는 국제처 유학생서비스 055-249-2914입니다.","answer_zh":"延长滞留期间可从滞留期间届满前4个月起申请，直至届满当日（电子民愿为届满前一日）。滞留类民愿须事先在HiKorea（www.hikorea.go.kr）预约来访；通用材料为统合申请书（附件第34号格式）、护照、外国人登录证和滞留地证明材料，各滞留资格的额外材料请在HiKorea“按滞留资格指南手册”或1345（外国人综合咨询中心）确认。学校的签证、外国人登录证业务可咨询国际处留学生服务 055-249-2914。","source":"[출입국 공식] 서울출입국·외국인청 알기 쉽고 편리한 출입국 민원 안내(법무부 출입국·외국인정책본부 게시 문서) https://www.immigration.go.kr/bbs/immigration/47/426385/download.do ; 유학생서비스센터 소개 https://www.kyungnam.ac.kr/international/6906/subview.do","checked_at":"","tags":["비자","签证","체류","居留","출입국","체류기간연장","하이코리아","续签"],"terms_ko":["비자 연장은 어떻게 해요?","체류기간 연장 신청 방법","비자 연장은 언제부터 신청할 수 있어요","비자","签证","체류","居留","출입국","체류기간연장","하이코리아","续签"],"terms_zh":["怎么续签签证？","延长滞留期间怎么办理？","비자","签证","체류","居留","출입국","체류기간연장","하이코리아","续签"]},{"id":"F10","question_ko":"학과 사무실은 어디에 있어요?|학과 조교실 위치가 어디예요|학과 사무실 전화번호 알려주세요","question_zh":"系办公室在哪里？","answer":"학과 사무실(조교실)의 위치·호실·전화번호는 소속 학과(부)마다 다릅니다. 소속 학과 사무실에 직접 문의하거나 학과 홈페이지의 ‘학과 소개·연락처’를 확인하세요. 유학생 관련 업무(외국인등록증·비자·유학생활)는 국제처 유학생서비스센터 055-249-2914, 국제처 대표 전화는 055-249-2299입니다.","answer_zh":"系办公室（助教室）的位置、房间号和电话因所属院系而异。请直接向所属院系办公室咨询，或在院系网站的“院系介绍·联系方式”中确认。留学生相关业务（外国人登录证、签证、留学生生活）请联系国际处留学生服务中心 055-249-2914，国际处代表电话 055-249-2299。","source":"유학생서비스센터 소개 https://www.kyungnam.ac.kr/international/6906/subview.do ; 국제처 https://www.kyungnam.ac.kr/international/14500/subview.do","checked_at":"","tags":["사무실","办公室","조교","助教","연락처","电话","학과사무실"],"terms_ko":["학과 사무실은 어디에 있어요?","학과 조교실 위치가 어디예요","학과 사무실 전화번호 알려주세요","사무실","办公室","조교","助教","연락처","电话","학과사무실"],"terms_zh":["系办公室在哪里？","사무실","办公室","조교","助教","연락처","电话","학과사무실"]},{"id":"F11","question_ko":"학교까지 버스 어떻게 타요?","question_zh":"怎么坐车到学校？","answer":"학교 주소는 경남 창원시 마산합포구 경남대학로 7(월영동)이고 대표전화는 055-245-5000입니다. ‘찾아오시는길’에는 마산역에서 일반버스 20·21·23·27·40·41·60·62·63·64·65·77·101·102·103·108·109·122번과 좌석 800번이 안내되어 있고(합성동시외버스터미널·마산고속버스터미널 노선도 안내됨), 남부시외버스터미널에서는 도보 10분입니다. 시내버스 시간표는 확인하지 못했습니다.","answer_zh":"学校地址：庆南昌原市马山合浦区庆南大学路7（月影洞），总机 055-245-5000。“交通指南”页面介绍：从马山站可乘普通公交20、21、23、27、40、41、60、62、63、64、65、77、101、102、103、108、109、122路及座席800路（另介绍了合成洞市外客运站、马山高速客运站的路线），从南部市外客运站步行10分钟。市内公交的时刻表未能确认。","source":"찾아오시는길 https://www.kyungnam.ac.kr/ko/4218/subview.do","checked_at":"","tags":["버스","公交"],"terms_ko":["학교까지 버스 어떻게 타요?","버스","公交"],"terms_zh":["怎么坐车到学校？","버스","公交"]},{"id":"F12","question_ko":"학식 메뉴는 어디서 봐요?|식당 위치랑 운영시간 알려주세요|학생식당 어디예요","question_zh":"食堂在哪里？|食堂几点开门？","answer":"학생식당은 한마관 1층에 있습니다. 운영시간은 조식 08:00~09:30, 중식 11:00~14:00, 석식 17:30~19:00이고 주말·공휴일은 운영하지 않습니다(한마생활관 복지시설 안내 기준). 주간 식단은 학교 홈페이지 ‘단체 식단’ 페이지와 한마생활관 ‘식단표’에 매주 게시되며, 식당 운영 담당은 동원홈푸드 055-249-2076입니다.","answer_zh":"学生食堂位于汉马馆（한마관）1层。营业时间为早餐 08:00~09:30、午餐 11:00~14:00、晚餐 17:30~19:00，周末及公休日不营业（依据汉马生活馆福利设施指南）。每周菜单发布在学校网站“团体餐单”页面和汉马生活馆“食谱表”中，食堂运营方为 Dongwon Home Food，电话 055-249-2076。","source":"한마생활관 복지시설(식당) https://www.kyungnam.ac.kr/dorm/3162/subview.do ; 단체 식단 https://www.kyungnam.ac.kr/ko/4454/subview.do ; 한마생활관 식단표 https://www.kyungnam.ac.kr/dorm/8736/subview.do","checked_at":"","tags":["식당","食堂","학식","메뉴","菜单","한마관","운영시간"],"terms_ko":["학식 메뉴는 어디서 봐요?","식당 위치랑 운영시간 알려주세요","학생식당 어디예요","식당","食堂","학식","메뉴","菜单","한마관","운영시간"],"terms_zh":["食堂在哪里？","食堂几点开门？","식당","食堂","학식","메뉴","菜单","한마관","운영시간"]},{"id":"F13","question_ko":"제1공학관은 어디에 있어요?|1공학관 위치 알려주세요|제1공학관 어디예요?","question_zh":"第一工学馆在哪？|工学馆怎么走？","answer":"제1공학관은 경남대 캠퍼스맵 11번에 있습니다. (지도에는 건물 내 층·호실 정보가 없으니 구체적인 호실은 학과/건물 안내에서 확인하세요.) 캠퍼스맵: https://inews.kyungnam.ac.kr/bbs/view.html?idxno=39517","answer_zh":"第一工学馆（제1공학관）在庆南大学校园地图 11 号（地图上没有楼内楼层和房间号，具体房间请向系办公室或楼内指引确认）。校园地图：https://inews.kyungnam.ac.kr/bbs/view.html?idxno=39517","source":"경남대 2026 캠퍼스맵(월영소식 2026-04-02) https://inews.kyungnam.ac.kr/bbs/view.html?idxno=39517","checked_at":"2026-10-28","tags":["공학관","工学馆","제1공학관","第一工学馆","건물","楼"],"terms_ko":["제1공학관은 어디에 있어요?","1공학관 위치 알려주세요","제1공학관 어디예요?","공학관","工学馆","제1공학관","第一工学馆","건물","楼"],"terms_zh":["第一工学馆在哪？","工学馆怎么走？","공학관","工学馆","제1공학관","第一工学馆","건물","楼"]},{"id":"F14","question_ko":"외국인 유학생 장학금 뭐가 있어요?|외국인 신편입학장학이 뭐예요|유학생 수업료 감면은 어떻게 돼요","question_zh":"留学生有哪些奖学金？|外国人新转入学奖学金是什么？","answer":"외국인 신·편입생에게는 ‘외국인신편입학장학’이 있으며 A·B급은 정규학기 이내 수업료 50%, C·E급은 입학 해당학기 수업료 70%, D급은 입학 해당학기 수업료 전액, F급은 입학 해당학기 수업료 50%입니다(A·C·D·E·F급은 입학금 면제). 재학 중에는 성적우수장학(A급 해당학기 수업료 전액, B급 2/3, C급 1/2)과 모범장학(A급 1/3, B급 1/5)도 안내되어 있습니다. 세부 선발기준은 장학제도 홈페이지·장학 공지를 확인하고, 문의는 교내장학금 055-249-2033입니다.","answer_zh":"外国人新生·转入生可获得“外国人新转入学奖学金”：A、B级为正规学期内学费的50%，C、E级为入学当学期学费的70%，D级为入学当学期学费全额，F级为入学当学期学费的50%（A、C、D、E、F级免除入学金）。在读期间还介绍了成绩优秀奖学金（A级为当学期学费全额，B级2/3，C级1/2）和模范奖学金（A级1/3，B级1/5）。具体选拔标准请查看奖学金制度网页及奖学金公告，咨询：校内奖学金 055-249-2033。","source":"장학제도(국제처 유학생 안내) https://www.kyungnam.ac.kr/kuit/7921/subview.do","checked_at":"","tags":["외국인장학","留学生奖学金","신편입학장학","수업료감면","外国人新转入学奖学金","성적우수장학","모범장학"],"terms_ko":["외국인 유학생 장학금 뭐가 있어요?","외국인 신편입학장학이 뭐예요","유학생 수업료 감면은 어떻게 돼요","외국인장학","留学生奖学金","신편입학장학","수업료감면","外国人新转入学奖学金","성적우수장학","모범장학"],"terms_zh":["留学生有哪些奖学金？","外国人新转入学奖学金是什么？","외국인장학","留学生奖学金","신편입학장학","수업료감면","外国人新转入学奖学金","성적우수장학","모범장학"]},{"id":"F15","question_ko":"외국인등록증은 어떻게 만들어요?|외국인등록은 언제까지 해야 해요|외국인등록에 필요한 서류가 뭐예요","question_zh":"外国人登录证怎么办理？|入境后多久内要办外国人登录？","answer":"91일 이상 장기 체류하려는 외국인은 입국일부터 90일 이내에 외국인등록을 해야 합니다. 유학생의 제출서류는 신청서, 여권, 사진(6개월 내 촬영 반명함 1장), 입국일 이후 발급된 재학증명서, 수수료이며 체류지 입증서류도 필요합니다. 학교의 외국인등록증 업무 문의는 국제처 유학생서비스 055-249-2914입니다.","answer_zh":"拟长期停留91天以上的外国人，须自入境之日起90日内办理外国人登录。留学生需提交申请书、护照、照片（6个月内拍摄的半身证件照1张）、入境后开具的在学证明、手续费，同时还需要滞留地证明材料。关于学校的外国人登录证业务，可咨询国际处留学生服务 055-249-2914。","source":"[출입국 공식] 한국유학종합시스템(스터디인코리아, 국립국제교육원) 거주 자격 및 체류 기간 https://cdn.studyinkorea.go.kr/mn/life/residenceAndStayInfo.do?tab=part-time-job ; 서울출입국·외국인청 출입국 민원 안내 https://www.immigration.go.kr/bbs/immigration/47/426385/download.do ; 유학생서비스센터 소개 https://www.kyungnam.ac.kr/international/6906/subview.do","checked_at":"","tags":["외국인등록증","外国人登录证","외국인등록","外国人登录","출입국","90일","登录证办理"],"terms_ko":["외국인등록증은 어떻게 만들어요?","외국인등록은 언제까지 해야 해요","외국인등록에 필요한 서류가 뭐예요","외국인등록증","外国人登录证","외국인등록","外国人登录","출입국","90일","登录证办理"],"terms_zh":["外国人登录证怎么办理？","入境后多久内要办外国人登录？","외국인등록증","外国人登录证","외국인등록","外国人登录","출입국","90일","登录证办理"]},{"id":"F16","question_ko":"이사하면 신고해야 해요?|체류지 변경 신고는 어떻게 해요|주소 바뀌면 외국인등록증 어떻게 해요","question_zh":"搬家后要申报吗？|变更滞留地怎么申报？","answer":"이사 등으로 체류지가 바뀌면 전입한 날부터 15일 이내에 관할 출입국·외국인관서 또는 새 체류지의 읍·면·동 주민센터에 신고해야 하며, 하이코리아(인터넷)로도 신고할 수 있습니다. 외국인은 세대주와 함께 자동 변경되지 않으므로 본인이 개별적으로 신고해야 합니다. 필요 서류는 여권, 외국인등록증, 체류지 입증서류, 신고서이며, 미신고 시 최대 범칙금 100만원 또는 과태료 200만원 처분이 있을 수 있습니다.","answer_zh":"因搬家等原因变更滞留地时，须自迁入之日起15日内向管辖的出入境·外国人机构或新滞留地的邑·面·洞居民中心申报，也可通过HiKorea（网上）申报。外国人不会随户主自动变更，须本人单独申报。所需材料为护照、外国人登录证、滞留地证明材料、申报书；未申报可能被处以最高100万韩元罚款（范则金）或最高200万韩元过失金。","source":"[출입국 공식] 서울출입국·외국인청 출입국 민원 안내 https://www.immigration.go.kr/bbs/immigration/47/426385/download.do ; 스터디인코리아(국립국제교육원) https://cdn.studyinkorea.go.kr/mn/life/residenceAndStayInfo.do?tab=part-time-job","checked_at":"","tags":["체류지변경","变更滞留地","이사","搬家","주소변경","15일","住址变更"],"terms_ko":["이사하면 신고해야 해요?","체류지 변경 신고는 어떻게 해요","주소 바뀌면 외국인등록증 어떻게 해요","체류지변경","变更滞留地","이사","搬家","주소변경","15일","住址变更"],"terms_zh":["搬家后要申报吗？","变更滞留地怎么申报？","체류지변경","变更滞留地","이사","搬家","주소변경","15일","住址变更"]},{"id":"F17","question_ko":"아르바이트 하려면 허가가 필요해요?|시간제취업 허가는 어떻게 받아요|유학생 알바 가능한가요|방학에도 허가가 필요해요","question_zh":"留学生打工需要许可吗？|兼职(时间制就业)许可怎么申请？","answer":"유학생은 시간제 취업허가를 받은 경우에만 일할 수 있으며, 방학이나 휴학 기간에도 허가가 필요합니다. 절차는 ①표준근로계약서 작성 ②대학 유학생 담당자의 시간제 취업 확인서 작성 ③온라인 또는 방문 신청(여권, 외국인등록증, 확인서, 성적 또는 출석증명서, 사업자등록증 사본, 표준근로계약서 등) ④허가 여부 확인입니다. 외국어 개인교습·제조업·건설업은 허가받을 수 없고(제조업은 TOPIK 4급 이상 등 예외 가능), 허가 없이 일하면 범칙금·출국조치 등 처분을 받을 수 있습니다. 가능한 근무시간과 한국어 능력 기준은 과정·학년에 따라 다르므로 학교 유학생 담당(국제처 055-249-2914)에 확인하세요.","answer_zh":"留学生只有获得时间制就业许可才能工作，寒暑假或休学期间也同样需要许可。流程为：①签订标准劳动合同；②由大学留学生负责人填写时间制就业确认书；③网上或到场申请（护照、外国人登录证、确认书、成绩或出勤证明、营业执照复印件、标准劳动合同等）；④确认是否获批。外语私人教学、制造业、建筑业不能获得许可（制造业如持有TOPIK 4级以上等可例外允许），无许可工作可能被处以罚款、限期出境等处分。可工作时间和韩语能力标准因课程、年级而异，请向学校留学生负责人（国际处 055-249-2914）确认。","source":"[출입국 공식] 한국유학종합시스템(스터디인코리아, 국립국제교육원) 거주 자격 및 체류 기간 - 아르바이트 https://cdn.studyinkorea.go.kr/mn/life/residenceAndStayInfo.do?tab=part-time-job ; 서울출입국·외국인청 출입국 민원 안내 https://www.immigration.go.kr/bbs/immigration/47/426385/download.do ; 유학생서비스센터 소개 https://www.kyungnam.ac.kr/international/6906/subview.do","checked_at":"","tags":["시간제취업","兼职","아르바이트","打工","알바","시간제취업허가","时间制就业","체류자격외활동"],"terms_ko":["아르바이트 하려면 허가가 필요해요?","시간제취업 허가는 어떻게 받아요","유학생 알바 가능한가요","방학에도 허가가 필요해요","시간제취업","兼职","아르바이트","打工","알바","시간제취업허가","时间制就业","체류자격외활동"],"terms_zh":["留学生打工需要许可吗？","兼职(时间制就业)许可怎么申请？","시간제취업","兼职","아르바이트","打工","알바","시간제취업허가","时间制就业","체류자격외활동"]},{"id":"F18","question_ko":"유학생도 건강보험에 가입해야 해요?|유학생 건강보험은 어떻게 가입돼요|건강보험료 안 내면 어떻게 돼요","question_zh":"留学生需要参加健康保险吗？|健康保险怎么加入？","answer":"2021년 3월부터 외국인 유학생도 국민건강보험 의무가입입니다. 가입요건은 대한민국에 6개월 이상 체류한 외국인으로, 6개월 동안 출국기간의 합이 30일 이하이면 계속 체류한 것으로 보고, 1회 30일을 초과해 출국하면 재입국일부터 6개월 이상 체류해야 가입할 수 있습니다. 6개월 이상 체류하면 국민건강보험공단이 자동 가입 처리하고 거소지로 건강보험증과 고지서를 보내며, 자동 가입이 안 되면(건강보험증 미수령 등) 가까운 지사(외국인 민원센터)에 방문해 신고하세요. 보험료를 체납하면 보험급여와 비자연장이 제한됩니다. 문의: 1577-1000(외국어 상담 7번, 영어·중국어·베트남어) 또는 033-811-2000, 국민건강보험공단 창원마산지사.","answer_zh":"自2021年3月起，外国留学生也必须加入国民健康保险。加入条件是在韩国滞留6个月以上的外国人；6个月内出境期间合计30天以下，视为连续滞留；若单次出境超过30天，则须自再入境之日起滞留6个月以上才能加入。滞留满6个月后，国民健康保险公团会自动办理加入，并将健康保险证和缴费通知单寄到居住地；若未能自动加入（如未收到健康保险证等），请到附近支部（外国人民愿中心）申报。拖欠保险费将限制保险给付和签证延期。咨询：1577-1000（外语咨询按7号，英语·中文·越南语）或 033-811-2000，国民健康保险公团昌原马山支部。","source":"Health Insurance(국제처) https://www.kyungnam.ac.kr/international/6908/subview.do ; [공식] 국민건강보험공단 외국인·재외국민 건강보험제도 https://www.nhis.or.kr/nhis/policy/wbhada02400m01.do ; 유학생서비스센터 소개 https://www.kyungnam.ac.kr/international/6906/subview.do","checked_at":"","tags":["건강보험","健康保险","국민건강보험","유학생보험","医保","보험료","D-2"],"terms_ko":["유학생도 건강보험에 가입해야 해요?","유학생 건강보험은 어떻게 가입돼요","건강보험료 안 내면 어떻게 돼요","건강보험","健康保险","국민건강보험","유학생보험","医保","보험료","D-2"],"terms_zh":["留学生需要参加健康保险吗？","健康保险怎么加入？","건강보험","健康保险","국민건강보험","유학생보험","医保","보험료","D-2"]},{"id":"F19","question_ko":"국제처에서 어떤 지원을 받을 수 있어요?|유학생서비스센터 연락처가 어떻게 돼요|국제처 전화번호 알려주세요|유학생지원팀은 어디에 문의해요","question_zh":"国际处能提供哪些支持？|留学生服务中心电话是多少？","answer":"유학생서비스센터는 유학생의 외국인등록증 발급, 비자연장 및 변경 등 출입국 관련 업무와 유학생활 지원 서비스를 제공하며, 학사지도 상담과 자국 음식을 요리할 수 있는 환경도 제공합니다. 유학생 일상 업무 문의는 유학생서비스센터 055-249-2914, 국제처 대표 전화는 055-249-2299, 외국인 입학·장학 문의는 대외교류처 055-249-2221입니다.","answer_zh":"留学生服务中心为留学生提供外国人登录证办理、签证延期及变更等出入境相关业务和留学生活支援服务，同时提供学业指导咨询以及可烹饪本国食物的环境。留学生日常事务咨询：留学生服务中心 055-249-2914；国际处总机 055-249-2299；外国人入学·奖学金咨询：对外交流处 055-249-2221。","source":"유학생서비스센터 소개 https://www.kyungnam.ac.kr/international/6906/subview.do ; 国际处 入学指南 https://www.kyungnam.ac.kr/ch/7568/subview.do ; 国际处 https://www.kyungnam.ac.kr/international/14500/subview.do (전화 055-249-2299)","checked_at":"","tags":["국제처","国际处","유학생지원","留学生服务","1:1멘토","공항픽업","유학생주방","留学生支援"],"terms_ko":["국제처에서 어떤 지원을 받을 수 있어요?","유학생서비스센터 연락처가 어떻게 돼요","국제처 전화번호 알려주세요","유학생지원팀은 어디에 문의해요","국제처","国际处","유학생지원","留学生服务","1:1멘토","공항픽업","유학생주방","留学生支援"],"terms_zh":["国际处能提供哪些支持？","留学生服务中心电话是多少？","국제처","国际处","유학생지원","留学生服务","1:1멘토","공항픽업","유학생주방","留学生支援"]},{"id":"F20","question_ko":"한국어교육센터는 어떻게 다녀요?|TOPIK 몇 급이면 학위과정 지원할 수 있어요|한국어교육센터 수업 시간이 어떻게 돼요","question_zh":"韩国语教育中心怎么上课？|TOPIK几级可以申请学位课程？","answer":"한국어교육센터는 1년 4학기제(학기당 10주·200시간)로, 월~금 09:00~12:50에 수업합니다. TOPIK 3급 이상을 취득했거나 본교 한국어교육센터 4급반을 수료한 경우에 한해 학위과정 지원이 가능합니다. 센터에서는 무료 TOPIK 대비반도 운영합니다. 문의: 입학 055-249-2016, 수업 055-249-2197.","answer_zh":"韩国语教育中心实行一年4学期制（每学期10周、200课时），周一至周五09:00~12:50上课。只有取得TOPIK 3级以上，或修完本校韩国语教育中心4级班者，才可申请学位课程。中心还开设免费TOPIK备考班。咨询：入学 055-249-2016，授课 055-249-2197。","source":"한국어교육센터 교육기간/교육내용/문의처 https://www.kyungnam.ac.kr/international/6903/subview.do","checked_at":"","tags":["한국어교육센터","韩国语教育中心","TOPIK","토픽","学位课程","한국어수업","학위과정지원"],"terms_ko":["한국어교육센터는 어떻게 다녀요?","TOPIK 몇 급이면 학위과정 지원할 수 있어요","한국어교육센터 수업 시간이 어떻게 돼요","한국어교육센터","韩国语教育中心","TOPIK","토픽","学位课程","한국어수업","학위과정지원"],"terms_zh":["韩国语教育中心怎么上课？","TOPIK几级可以申请学位课程？","한국어교육센터","韩国语教育中心","TOPIK","토픽","学位课程","한국어수업","학위과정지원"]},{"id":"F21","question_ko":"졸업하려면 TOPIK 몇 급이 필요해요?|유학생 졸업 요건에 한국어 급수가 있어요|외국인 졸업요건이 달라요","question_zh":"毕业需要TOPIK几级？|留学生毕业有韩语等级要求吗？","answer":"확인한 국제처 안내에는 학사과정 입학 요건으로 TOPIK 3급 이상(공대·예체능 계열 2급 이상)이 안내되어 있습니다. 다만 졸업 요건으로 TOPIK 급수를 명시한 공식 자료는 확인하지 못했습니다. 졸업 요건은 학과(부)별로 다르므로 소속 학과 사무실과 국제처 유학생서비스센터(055-249-2914)에 확인하세요.","answer_zh":"国际处公开说明中，本科入学要求为 TOPIK 3级以上（工科及艺体能系列 2级以上）。但未找到明确规定毕业所需 TOPIK 等级的官方资料。毕业条件因院系而异，请向所属院系办公室和国际处留学生服务中心（055-249-2914）确认。","source":"국제처 中文 FAQ https://www.kyungnam.ac.kr/ch/7569/subview.do ; 유학생서비스센터 소개 https://www.kyungnam.ac.kr/international/6906/subview.do","checked_at":"","tags":["졸업","毕业","TOPIK","토픽","졸업요건","韩语等级","외국인졸업"],"terms_ko":["졸업하려면 TOPIK 몇 급이 필요해요?","유학생 졸업 요건에 한국어 급수가 있어요","외국인 졸업요건이 달라요","졸업","毕业","TOPIK","토픽","졸업요건","韩语等级","외국인졸업"],"terms_zh":["毕业需要TOPIK几级？","留学生毕业有韩语等级要求吗？","졸업","毕业","TOPIK","토픽","졸업요건","韩语等级","외국인졸업"]},{"id":"F22","question_ko":"재학증명서는 어디서 떼요?|증명서 발급은 어떻게 해요|영문 증명서도 발급되나요","question_zh":"在读证明在哪里开？|证明书怎么办理？","answer":"국·영문 재학증명서(재학 중), 휴학증명서(휴학 시), 제적증명서, 수료·졸업증명서 등을 신청할 수 있습니다. 본관 1층 로비 자동증명서발급기를 이용하거나, 본관 1층 학사관리부 학생서비스센터(055-249-2494)에서 담당자에게 직접 발급받을 수 있습니다. 증명서 발급 문의: 학사관리팀 055-249-2414, 2494.","answer_zh":"可申请中、英文在读证明（在读期间）、休学证明（休学时）、除籍证明、结业·毕业证明等。可使用本馆1层大厅的自动证明书发放机，或到本馆1层学事管理部学生服务中心（055-249-2494）由负责人当面办理。证明书发放咨询：学事管理组 055-249-2414、2494。","source":"증명서 발급 안내(Q&A) https://www.kyungnam.ac.kr/indbiz/1710/subview.do ; 2026학년도 1학기 등록금 최종 납부 안내(연락처 표) https://www.kyungnam.ac.kr/bbs/ko/1398/107845/download.do","checked_at":"","tags":["증명서","证明书","재학증명서","在读证明","영문증명서","발급","증명서발급"],"terms_ko":["재학증명서는 어디서 떼요?","증명서 발급은 어떻게 해요","영문 증명서도 발급되나요","증명서","证明书","재학증명서","在读证明","영문증명서","발급","증명서발급"],"terms_zh":["在读证明在哪里开？","证明书怎么办理？","증명서","证明书","재학증명서","在读证明","영문증명서","발급","증명서발급"]},{"id":"F23","question_ko":"학생정보시스템은 어떻게 들어가요?|학정시 접속 방법|학정시가 뭐예요","question_zh":"怎么登录学生信息系统？|学正时是什么？","answer":"학생정보시스템(학정시)은 NAVER에서 ‘경남대학교’를 검색해 공식 홈페이지에 접속한 뒤 ‘학생정보시스템’을 클릭하거나, NAVER에서 ‘경남대학교 학생정보시스템’을 직접 검색해 접속할 수 있습니다. 수강신청 주소는 https://sugang.kyungnam.ac.kr이며, 수강바구니 신청 등은 ‘수업관리’ 메뉴에서, 휴학·복학 등은 ‘학적관리’ 메뉴에서 진행합니다.","answer_zh":"学生信息系统（学正时）可在NAVER搜索“경남대학교”，进入官方网站后点击“学生信息系统”，或直接在NAVER搜索“庆南大学学生信息系统”进入。选课网址为 https://sugang.kyungnam.ac.kr，预选课篮子申请等在“课程管理”菜单中办理，休学、复学等在“学籍管理”菜单中办理。","source":"경남대학교 학생정보시스템 접속 방법(유학생 안내, 한/중) https://www.kyungnam.ac.kr/pdfView/international/49/fileDownload.do ; 학사공지 2024학년도 1학기 수강신청 안내 https://www.kyungnam.ac.kr/ko/8443/subview.do?enc=Zm5jdDF8QEB8JTJGYmJzJTJGa28lMkYxMzk4JTJGMTUzNzYzJTJGYXJ0Y2xWaWV3LmRvJTNG","checked_at":"","tags":["학생정보시스템","学生信息系统","학정시","学正时","로그인","登录","수강신청사이트"],"terms_ko":["학생정보시스템은 어떻게 들어가요?","학정시 접속 방법","학정시가 뭐예요","학생정보시스템","学生信息系统","학정시","学正时","로그인","登录","수강신청사이트"],"terms_zh":["怎么登录学生信息系统？","学正时是什么？","학생정보시스템","学生信息系统","학정시","学正时","로그인","登录","수강신청사이트"]},{"id":"F24","question_ko":"학교에 상담센터가 있어요?|심리상담은 어디서 받아요|상담센터 위치와 운영시간 알려주세요","question_zh":"学校有心理咨询中心吗？|心理咨询在哪里做？","answer":"대학생활문화원 상담센터는 창조관 1층에 있고(전화 055-249-2722), 경남대 학생이라면 누구나 이용할 수 있습니다. 접수면접·심리검사·검사해석·심리상담은 예약으로 진행되며 모든 상담 내용은 비밀이 보장됩니다. 이용시간은 학기 중 월~금 9:00~18:00, 방학 중 월~금 9:00~17:00이고 점심시간은 12:00~13:00입니다.","answer_zh":"大学生活文化院咨询中心位于创造馆1层（电话 055-249-2722），庆南大学学生均可使用。接收面谈、心理测验、测验解读、心理咨询均需预约进行，所有咨询内容严格保密。使用时间为学期中周一至周五9:00~18:00，假期中周一至周五9:00~17:00，午休时间12:00~13:00。","source":"대학생활문화원 상담센터 https://www.kyungnam.ac.kr/ko/4447/subview.do","checked_at":"","tags":["상담센터","心理咨询","심리상담","咨询中心","대학생활문화원","창조관","心理测验"],"terms_ko":["학교에 상담센터가 있어요?","심리상담은 어디서 받아요","상담센터 위치와 운영시간 알려주세요","상담센터","心理咨询","심리상담","咨询中心","대학생활문화원","창조관","心理测验"],"terms_zh":["学校有心理咨询中心吗？","心理咨询在哪里做？","상담센터","心理咨询","심리상담","咨询中心","대학생활문화원","창조관","心理测验"]},{"id":"F25","question_ko":"학교에 보건실이 있어요?|아프면 어디로 가요|보건진료소 위치 알려주세요","question_zh":"学校有医务室吗？|生病了去哪里？","answer":"보건진료소는 한마관 1층에 있고 전화는 055-249-2782입니다. 혈압·혈당·체온·맥박 측정, 시력검사, 비만도 검사 같은 기본 건강관리와 건강상담을 하고, 가벼운 외상 치료와 응급처치가 가능하며 두통약·감기약·소화제 등 기본 상비약을 무료로 제공합니다. 응급 상황에는 응급처치 후 지정 의료기관으로 연계합니다. 운영시간은 홈페이지에 게시되어 있지 않으니 방문 전에 전화로 확인하세요.","answer_zh":"保健诊疗所位于汉马馆1层，电话 055-249-2782。提供血压·血糖·体温·脉搏测量、视力检查、肥胖度检查等基本健康管理与健康咨询，可处理轻微外伤和急救，并免费提供头痛药、感冒药、消化药等常备药。遇紧急情况会在急救后转介至指定医疗机构。官网未公布营业时间，访问前请电话确认。","source":"보건진료소 https://www.kyungnam.ac.kr/ko/4452/subview.do","checked_at":"","tags":["보건진료소","医务室","보건실","健康咨询","진료","한마관","医疗"],"terms_ko":["학교에 보건실이 있어요?","아프면 어디로 가요","보건진료소 위치 알려주세요","보건진료소","医务室","보건실","健康咨询","진료","한마관","医疗"],"terms_zh":["学校有医务室吗？","生病了去哪里？","보건진료소","医务室","보건실","健康咨询","진료","한마관","医疗"]},{"id":"F26","question_ko":"도서관은 어떻게 이용해요?|중앙도서관 운영시간이 어떻게 돼요|도서관 몇 층에 뭐가 있어요|중앙도서관 위치 알려주세요","question_zh":"图书馆怎么使用？|图书馆几点开门？","answer":"중앙도서관 1층 대출반납실·휴 플레이스, 3층 연속간행물실·수험자료실·학위논문실, 4층 신간대출실·참고자료실·고전자료실·한적실은 월~금 09:00~18:00에 운영하고 토·일은 휴관입니다. 2층 일반열람실(제1~4열람실)은 06:00~24:00에 운영하며, 마감 10분 전부터 자료실 입장이 제한되고 토요일과 야간 운영시간은 도서관 사정에 따라 변경될 수 있습니다(방학 중에는 이용시간이 변경됩니다). 위치는 경남 창원시 마산합포구 경남대학로 7(월영동)이고, 문의는 055-249-2918, 2920(대출 반납)입니다.","answer_zh":"中央图书馆1层借还书室·休Place、3层连续出版物室·备考资料室·学位论文室、4层新书借阅室·参考资料室·古典资料室·汉籍室，周一至周五09:00~18:00开放，周六、周日闭馆。2层普通阅览室（第1~4阅览室）开放时间为06:00~24:00；闭馆前10分钟起限制进入资料室，周六及夜间开放时间可能根据图书馆情况调整（假期期间使用时间会变更）。地址：庆南昌原市马山合浦区庆南大学路7（月影洞），咨询：055-249-2918、2920（借还书）。","source":"이용시간 https://library.kyungnam.ac.kr/webcontent/info/47 ; 층별안내 https://library.kyungnam.ac.kr/webcontent/info/48","checked_at":"","tags":["도서관","图书馆","중앙도서관","대출","借书","모바일이용증","열람실"],"terms_ko":["도서관은 어떻게 이용해요?","중앙도서관 운영시간이 어떻게 돼요","도서관 몇 층에 뭐가 있어요","중앙도서관 위치 알려주세요","도서관","图书馆","중앙도서관","대출","借书","모바일이용증","열람실"],"terms_zh":["图书馆怎么使用？","图书馆几点开门？","도서관","图书馆","중앙도서관","대출","借书","모바일이용증","열람실"]},{"id":"F28","question_ko":"휴학 중에 주소나 전화번호가 바뀌면 어떻게 해요?|휴학 중 연락처 변경은 어디서 해요|휴학 중에 학교 연락을 받으려면","question_zh":"休学期间地址或电话变了怎么办？|休学期间联系方式变更在哪里办理？","answer":"휴학 중 주소나 전화번호가 바뀌면 학생정보시스템에서 반드시 변경 신청을 해야 하며, 변경하지 않아 생기는 불이익은 본인이 책임집니다. 유학생은 체류지 변경 신고도 별도로 해야 하므로 F16 안내(이사 후 15일 이내)를 함께 확인하세요.","answer_zh":"休学期间地址或电话号码变更时，必须在学生信息系统中提交变更申请，因未变更而产生的不利后果由本人承担。留学生还需另行办理滞留地变更申报，请同时参考F16的说明（搬家后15日内）。","source":"휴학 안내(경남대학교 학적) https://www.kyungnam.ac.kr/ko/4401/subview.do ; [출입국 공식] https://www.immigration.go.kr/bbs/immigration/47/426385/download.do","checked_at":"","tags":["휴학주소변경","休学地址变更","연락처변경","联系方式变更","학생정보시스템","주소및전화번호","휴학중"],"terms_ko":["휴학 중에 주소나 전화번호가 바뀌면 어떻게 해요?","휴학 중 연락처 변경은 어디서 해요","휴학 중에 학교 연락을 받으려면","휴학주소변경","休学地址变更","연락처변경","联系方式变更","학생정보시스템","주소및전화번호","휴학중"],"terms_zh":["休学期间地址或电话变了怎么办？","休学期间联系方式变更在哪里办理？","휴학주소변경","休学地址变更","연락처변경","联系方式变更","학생정보시스템","주소및전화번호","휴학중"]},{"id":"F29","question_ko":"졸업하고 한국에서 취업하려면 비자가 어떻게 돼요?|구직비자 D-10이 뭐예요|졸업 후 체류자격 변경은 어디서 상담해요","question_zh":"毕业后在韩国求职签证怎么办？|求职签证D-10是什么？","answer":"졸업 후 한국에서 구직하려면 구직(D-10-1) 체류자격으로 변경해야 하며, 한 번에 6개월씩 최대 2년까지 연장할 수 있습니다. 제출서류는 공통서류, 구직활동계획서, 학위증, 체류지 입증서류(임대차계약서)와 해당자에 한해 한국어 능력 입증서류·경력증명서이고, 체류경비 입증서류는 유학(D-2)에서 구직(D-10)으로 최초 변경하는 경우 면제됩니다. 학교는 경남비자지원센터와 연계해 ‘2026년 찾아가는 취업·비자특강’(2026.9.8)을 열어 졸업 후 체류자격 변경 등을 안내했으니 국제처에 문의하세요.","answer_zh":"毕业后想在韩国求职，须变更为求职（D-10-1）滞留资格，每次6个月，最长可延长至2年。提交材料为通用材料、求职活动计划书、学位证、滞留地证明材料（租赁合同），以及仅限适用者的韩语能力证明材料、经历证明；由留学（D-2）首次变更为求职（D-10）者免交滞留费用证明材料。学校曾与庆南签证支援中心合作，于2026.9.8举办“2026年上门就业·签证讲座”，介绍毕业后滞留资格变更等内容，请向国际处咨询。","source":"[출입국 공식] 한국유학종합시스템(스터디인코리아, 국립국제교육원) - 구직 비자 변경 https://cdn.studyinkorea.go.kr/mn/life/residenceAndStayInfo.do?tab=part-time-job ; 월영소식: 경남대, 외국인 유학생 대상 취업·체류 비자 특강 개최 https://inews.kyungnam.ac.kr/bbs/view.html?idxno=39760","checked_at":"","tags":["구직비자","求职签证","D-10","졸업후비자","毕业后签证","체류자격변경","취업비자","경남비자지원센터"],"terms_ko":["졸업하고 한국에서 취업하려면 비자가 어떻게 돼요?","구직비자 D-10이 뭐예요","졸업 후 체류자격 변경은 어디서 상담해요","구직비자","求职签证","D-10","졸업후비자","毕业后签证","체류자격변경","취업비자","경남비자지원센터"],"terms_zh":["毕业后在韩国求职签证怎么办？","求职签证D-10是什么？","구직비자","求职签证","D-10","졸업후비자","毕业后签证","체류자격변경","취업비자","경남비자지원센터"]},{"id":"F30","question_ko":"휴학하면 비자(체류자격)에 영향이 있어요?|유학생이 휴학해도 한국에 있을 수 있어요|휴학하면 외국인등록증은 어떻게 돼요","question_zh":"休学会影响签证（滞留资格）吗？|留学生休学后还能留在韩国吗？","answer":"휴학이 체류자격(비자)에 미치는 영향은 휴학 기간과 남은 체류기간에 따라 달라 개별 확인이 필요합니다. 유학생의 비자·외국인등록증 업무는 국제처 유학생서비스센터 055-249-2914에서 안내하며, 출입국 민원은 하이코리아(www.hikorea.go.kr)·1345(외국인종합안내센터)에서 확인합니다. 참고로 방학이나 휴학기간에도 시간제취업허가를 받은 경우에만 일할 수 있습니다.","answer_zh":"休学对滞留资格（签证）的影响取决于休学期间和剩余滞留期限，需个别确认。留学生的签证、外国人登录证业务由国际处留学生服务中心（055-249-2914）负责；出入境业务请通过 Hi Korea（www.hikorea.go.kr）或 1345（外国人综合咨询中心）确认。另需注意：即使放假或休学期间，也只有获得时间制就业许可才能打工。","source":"유학생서비스센터 소개 https://www.kyungnam.ac.kr/international/6906/subview.do ; [출입국 공식] 한국유학종합시스템 거주 자격 및 체류 기간 https://cdn.studyinkorea.go.kr/mn/life/residenceAndStayInfo.do?tab=part-time-job","checked_at":"","tags":["휴학비자","休学签证","체류자격","滞留资格","유학생휴학","외국인등록증","休学影响"],"terms_ko":["휴학하면 비자(체류자격)에 영향이 있어요?","유학생이 휴학해도 한국에 있을 수 있어요","휴학하면 외국인등록증은 어떻게 돼요","휴학비자","休学签证","체류자격","滞留资格","유학생휴학","외국인등록증","休学影响"],"terms_zh":["休学会影响签证（滞留资格）吗？","留学生休学后还能留在韩国吗？","휴학비자","休学签证","체류자격","滞留资格","유학생휴학","외국인등록증","休学影响"]},{"id":"F31","question_ko":"기숙사 중도입사는 어떻게 해요?|기숙사 중간에 퇴사하면 환불돼요?|기숙사 퇴사 절차 알려주세요|생활관 환불 규정이 어떻게 돼요","question_zh":"宿舍中途入住怎么办理？|中途退宿能退钱吗？","answer":"중도입사는 행정실에 문의하고 생활관비를 납부한 뒤 입사합니다. 2026학년도 2학기 중도입사 납부액은 4주 이내(9/1~9/28) 전액, 8주 이내(9/29~10/26) 2/3, 10주 이내(10/27~11/9) 1/2, 10주 이후(11/10~) 1/3입니다. 중도퇴사는 퇴사 전 행정실을 방문해 퇴사신청서(퇴사원서)를 작성하고(환급용 통장 지참) 지도조교·행정실 확인 후 퇴사 당일 경비실에 퇴사신고를 하며, 환불은 2학기 기준 7일 이내(9/1~9/7) 15만원 공제, 4주 이내(9/8~9/28) 2/3 환급, 8주 이내(9/29~10/26) 1/3 환급, 8주 이후(10/27~) 환급 없음입니다. 입사 취소 및 중도퇴사 시 동일 학년도 기숙사 재지원은 불가합니다.","answer_zh":"中途入住须向行政室咨询，缴纳生活馆费用后入住。2026学年度第2学期中途入住缴费额：4周内（9/1~9/28）全额，8周内（9/29~10/26）2/3，10周内（10/27~11/9）1/2，10周之后（11/10起）1/3。中途退宿须在退宿前到行政室填写退宿申请书（需带退款用存折），经指导助教及行政室确认后退宿，并在退宿当天向警卫室办理退宿申报；以第2学期为准，退款标准为：7天内（9/1~9/7）扣除15万韩元，4周内（9/8~9/28）退还2/3，8周内（9/29~10/26）退还1/3，8周之后（10/27起）不予退款。取消入住及中途退宿者，同一学年度不得再次申请宿舍。","source":"중도 입/퇴사 https://www.kyungnam.ac.kr/dorm/1554/subview.do ; 2026학년도 2학기 관리비(중도 입사자 및 퇴사자 환불)내역 안내 https://www.kyungnam.ac.kr/dorm/3170/subview.do","checked_at":"","tags":["기숙사환불","宿舍退款","중도퇴사","中途退宿","중도입사","퇴사","생활관비"],"terms_ko":["기숙사 중도입사는 어떻게 해요?","기숙사 중간에 퇴사하면 환불돼요?","기숙사 퇴사 절차 알려주세요","생활관 환불 규정이 어떻게 돼요","기숙사환불","宿舍退款","중도퇴사","中途退宿","중도입사","퇴사","생활관비"],"terms_zh":["宿舍中途入住怎么办理？","中途退宿能退钱吗？","기숙사환불","宿舍退款","중도퇴사","中途退宿","중도입사","퇴사","생활관비"]},{"id":"F32","question_ko":"기숙사 방학 중 이용 요금은 얼마예요?|방학 때 생활관에 머무를 수 있어요|생활관 거주기간이 언제까지예요","question_zh":"放假期间住宿舍多少钱？|宿舍居住期间是什么时候？","answer":"2026학년도 생활관 거주기간은 1학기 2026.3.1~6.22, 2학기 2026.9.1~12.21(2학기 112일)입니다. 방학 중 관리비는 1박 기준 본교생 10,000원, 외부인 20,000원이며 2025년 동계방학부터 시행되었습니다. 자세한 사항은 한마생활관 행정실(055-249-2260, 2261)에 문의하세요.","answer_zh":"2026学年度生活馆居住期间为第1学期2026.3.1~6.22、第2学期2026.9.1~12.21（第2学期112天）。假期管理费按每晚计算，本校学生10,000韩元，校外人员20,000韩元，自2025年寒假起实施。详情请咨询汉马生活馆行政室（055-249-2260、2261）。","source":"2026학년도 2학기 관리비(중도 입사자 및 퇴사자 환불)내역 안내 https://www.kyungnam.ac.kr/dorm/3170/subview.do ; 안내전화 https://www.kyungnam.ac.kr/dorm/2898/subview.do","checked_at":"","tags":["방학기숙사","假期宿舍","방학중관리비","거주기간","居住期间","생활관","寒假住宿"],"terms_ko":["기숙사 방학 중 이용 요금은 얼마예요?","방학 때 생활관에 머무를 수 있어요","생활관 거주기간이 언제까지예요","방학기숙사","假期宿舍","방학중관리비","거주기간","居住期间","생활관","寒假住宿"],"terms_zh":["放假期间住宿舍多少钱？","宿舍居住期间是什么时候？","방학기숙사","假期宿舍","방학중관리비","거주기간","居住期间","생활관","寒假住宿"]},{"id":"F33","question_ko":"TOPIK 응시료 지원이 있어요?|TOPIK 시험 비용 지원 받을 수 있어요|유학생 TOPIK 응시료 얼마예요","question_zh":"有TOPIK报名费补助吗？|TOPIK考试费用有补贴吗？","answer":"국제처 입학지침에는 재학 중 TOPIK 응시료 지원이 안내되어 있으며, 지원 횟수는 재학 중 3회이고 TOPIK I은 40,000원, TOPIK II는 55,000원입니다. 신청 방법과 시기는 페이지에 나오지 않으니 국제처(+82-55-249-2221)에 확인하세요.","answer_zh":"国际处入学指南中介绍了在读期间的TOPIK报名费补助：在读期间最多3次，TOPIK I 为40,000韩元，TOPIK II 为55,000韩元。申请方法和时间页面中未提及，请向国际处（+82-55-249-2221）确认。","source":"国际处 入学指南 https://www.kyungnam.ac.kr/ch/7568/subview.do","checked_at":"","tags":["TOPIK응시료","TOPIK报名费","토픽지원","응시료지원","TOPIK补助","유학생지원","토픽"],"terms_ko":["TOPIK 응시료 지원이 있어요?","TOPIK 시험 비용 지원 받을 수 있어요","유학생 TOPIK 응시료 얼마예요","TOPIK응시료","TOPIK报名费","토픽지원","응시료지원","TOPIK补助","유학생지원","토픽"],"terms_zh":["有TOPIK报名费补助吗？","TOPIK考试费用有补贴吗？","TOPIK응시료","TOPIK报名费","토픽지원","응시료지원","TOPIK补助","유학생지원","토픽"]},{"id":"F34","question_ko":"외국인 신입생 기숙사비 지원이 있어요?|유학생 기숙사비 100% 지원 조건이 뭐예요|TOPIK 급수에 따라 기숙사비 지원돼요","question_zh":"外国新生有宿舍费补助吗？|宿舍费补助的条件是什么？","answer":"국제처 입학지침에는 신입생 기숙사비 지원이 안내되어 있습니다. TOPIK 4급 이상 등은 100% 지원 2회, TOPIK 3급 등은 100% 지원 1회이며, 편입생은 제외되고 방학은 제외됩니다. 세부 조건과 신청 방법은 국제처(+82-55-249-2221)에 확인하세요.","answer_zh":"国际处入学指南中介绍了新生宿舍费补助：TOPIK 4级以上等为100%补助2次，TOPIK 3级等为100%补助1次；转入生除外，假期除外。具体条件和申请方法请向国际处（+82-55-249-2221）确认。","source":"国际处 入学指南 https://www.kyungnam.ac.kr/ch/7568/subview.do","checked_at":"","tags":["기숙사비지원","宿舍费补助","신입생기숙사","新生宿舍","TOPIK급수","생활관지원","宿舍补贴"],"terms_ko":["외국인 신입생 기숙사비 지원이 있어요?","유학생 기숙사비 100% 지원 조건이 뭐예요","TOPIK 급수에 따라 기숙사비 지원돼요","기숙사비지원","宿舍费补助","신입생기숙사","新生宿舍","TOPIK급수","생활관지원","宿舍补贴"],"terms_zh":["外国新生有宿舍费补助吗？","宿舍费补助的条件是什么？","기숙사비지원","宿舍费补助","신입생기숙사","新生宿舍","TOPIK급수","생활관지원","宿舍补贴"]},{"id":"F35","question_ko":"외국인 신입생 입학 장학금은 어떻게 돼요?|TOPIK 4급이면 장학금 받을 수 있어요|외국인 신편입생 학비 감면 기준이 뭐예요","question_zh":"外国新生入学奖学金怎么算？|TOPIK 4级可以拿奖学金吗？","answer":"국제처 입학지침의 외국인 신·편입생 장학은 A급(신입·편입·전과)이 4년간 학비 50% 감면(직전 학기 성적평점 C0 이상 유지), B급은 TOPIK 4급 이상으로 입학학기 70%(신입생만), C급은 TOEFL iBT 90·IELTS 6.5 이상으로 입학학기 100%(신입생만, 영어권 모국어자 제외), D급은 TOEFL iBT 85·IELTS 6.0 이상으로 입학학기 70%입니다. A급의 선발 기준은 이 안내에 나와 있지 않으니 국제처에 확인하세요.","answer_zh":"国际处入学指南中的外国新生·转入生奖学金：A级（新生·转入·转专业）4年内学费减免50%（需保持上一学期成绩平点C0以上）；B级为TOPIK 4级以上，入学学期减免70%（仅限新生）；C级为TOEFL iBT 90、IELTS 6.5以上，入学学期减免100%（仅限新生，英语母语者除外）；D级为TOEFL iBT 85、IELTS 6.0以上，入学学期减免70%。A级的选拔标准在本说明中未列出，请向国际处确认。","source":"国际处 入学指南 https://www.kyungnam.ac.kr/ch/7568/subview.do","checked_at":"","tags":["신입생장학","新生奖学金","TOPIK4급","TOEFL","IELTS","학비감면","外国新生奖学金"],"terms_ko":["외국인 신입생 입학 장학금은 어떻게 돼요?","TOPIK 4급이면 장학금 받을 수 있어요","외국인 신편입생 학비 감면 기준이 뭐예요","신입생장학","新生奖学金","TOPIK4급","TOEFL","IELTS","학비감면","外国新生奖学金"],"terms_zh":["外国新生入学奖学金怎么算？","TOPIK 4级可以拿奖学金吗？","신입생장학","新生奖学金","TOPIK4급","TOEFL","IELTS","학비감면","外国新生奖学金"]},{"id":"F36","question_ko":"도서관에서 책 몇 권 빌릴 수 있어요?|도서관 대출 기간 연장은 어떻게 해요|학생증 없으면 도서관 대출 못 해요|연체하면 어떻게 돼요","question_zh":"图书馆能借几本书？|怎么续借？","answer":"학부생은 일반도서 10권을 14일간 빌릴 수 있고 비도서는 1권 3일, 딸림자료는 10권 5일입니다(대학원생은 20권 30일, 전자책은 7권 10일). 대출 시 신분증(모바일 이용증, 학생증 등)을 제시하고, 연장은 반납예정일 이전에 1회 가능하지만 연체 중이거나 다른 사람의 예약이 있으면 불가합니다. 연체하면 연체일수만큼 대출이 중지되고, 예약은 1인 3권까지이며, 업무시간 외에는 1층 로비 도서반납함에 반납합니다.","answer_zh":"本科生可借普通图书10本，期限14天；非图书资料1本3天，附属资料10本5天（研究生20本30天，电子书7本10天）。借阅时须出示身份证件（手机使用证、学生证等）；续借须在应还日之前，限1次，但逾期中或他人已预约时不可续借。逾期则按逾期天数暂停借阅；预约每人限3本；非办公时间请将书还至1层大厅还书箱。","source":"대출 https://library.kyungnam.ac.kr/webcontent/info/43","checked_at":"","tags":["도서관대출","图书馆借书","대출기간","续借","연체","모바일이용증","도서관규정"],"terms_ko":["도서관에서 책 몇 권 빌릴 수 있어요?","도서관 대출 기간 연장은 어떻게 해요","학생증 없으면 도서관 대출 못 해요","연체하면 어떻게 돼요","도서관대출","图书馆借书","대출기간","续借","연체","모바일이용증","도서관규정"],"terms_zh":["图书馆能借几本书？","怎么续借？","도서관대출","图书馆借书","대출기간","续借","연체","모바일이용증","도서관규정"]},{"id":"F37","question_ko":"학사경고 받으면 어떻게 돼요?|학사경고 받으면 수강신청에 제한이 있어요|학사경고 두 번 받으면 몇 학점까지 들을 수 있어요","question_zh":"收到学业警告会怎样？|学业警告后选课有限制吗？","answer":"2회 연속 학사경고를 받은 학생은 수강신청 학점이 15학점 이내로 제한되며, 한마러닝하이를 이수하면 제한이 해제됩니다. 수강신청 학점 제한과 관련한 자세한 사항은 학사관리팀(055-249-2480)에 문의하세요. 학사경고 기준 자체는 이 안내에서 확인하지 못했습니다.","answer_zh":"连续2次收到学业警告的学生，选课学分限制在15学分以内；修完“汉马Learning High”后限制解除。关于选课学分限制的详情请咨询学事管理组（055-249-2480）。学业警告的认定标准本说明中未能确认。","source":"수강신청 https://www.kyungnam.ac.kr/ko/4390/subview.do","checked_at":"","tags":["학사경고","学业警告","수강학점제한","选课学分限制","한마러닝하이","15학점","学业预警"],"terms_ko":["학사경고 받으면 어떻게 돼요?","학사경고 받으면 수강신청에 제한이 있어요","학사경고 두 번 받으면 몇 학점까지 들을 수 있어요","학사경고","学业警告","수강학점제한","选课学分限制","한마러닝하이","15학점","学业预警"],"terms_zh":["收到学业警告会怎样？","学业警告后选课有限制吗？","학사경고","学业警告","수강학점제한","选课学分限制","한마러닝하이","15학점","学业预警"]},{"id":"F38","question_ko":"휴학 중에도 수강신청 할 수 있어요?|휴학생이 수강신청하면 복학 신청도 해야 해요|수강신청하고 복학 안 하면 어떻게 돼요","question_zh":"休学期间也可以选课吗？|选课后还要办理复学吗？","answer":"수강신청은 휴학생도 할 수 있지만, 수강신청 후에는 복학신청을 꼭 해야 합니다(등록금 납부·수강신청을 한 경우라도 복학신청은 필수). 복학신청을 하지 않으면 수강을 하더라도 학기인정을 받을 수 없고, 수강신청 후 1/4선까지 복학을 하지 않으면 수강신청 내역이 삭제됩니다.","answer_zh":"休学生也可以选课，但选课之后必须办理复学申请（即使已缴学费、已选课，复学申请仍然是必须的）。未办理复学申请的话，即使上课也无法获得学期认定；选课后到学期1/4处为止仍未复学的，选课记录将被删除。","source":"복학 https://www.kyungnam.ac.kr/ko/4402/subview.do","checked_at":"","tags":["휴학생수강신청","休学生选课","복학신청필수","复学申请","수강신청삭제","1/4선","학기인정"],"terms_ko":["휴학 중에도 수강신청 할 수 있어요?","휴학생이 수강신청하면 복학 신청도 해야 해요","수강신청하고 복학 안 하면 어떻게 돼요","휴학생수강신청","休学生选课","복학신청필수","复学申请","수강신청삭제","1/4선","학기인정"],"terms_zh":["休学期间也可以选课吗？","选课后还要办理复学吗？","휴학생수강신청","休学生选课","복학신청필수","复学申请","수강신청삭제","1/4선","학기인정"]},{"id":"F39","question_ko":"한마생활관 전화번호가 뭐예요?|기숙사 행정실 연락처 알려주세요|생활관 관장실 번호가 어떻게 돼요","question_zh":"汉马生活馆电话是多少？|宿舍   function isFaqSiteKey(key) {
    if (!key) return false;
    if (key.indexOf("faq_local_") === 0) return true;
    return key === "campus_map_favorites" || key === "campus_map_tint" || key === "faq_theme" || key === "faq_ui_lang";
  }
  function clearAllSiteData() {
    try {
      for (const key of localStorageKeys()) {
        if (isFaqSiteKey(key)) localStorage.removeItem(key);
      }
    } catch (e) { /* private mode */ }
  }
  function paintLocalData() {
    const copy = LOCAL_COPY[uiLang === "ko" ? "ko" : "zh"];
    $("local-data-summary").textContent = copy.summary;
    $("local-data-only").textContent = copy.only;
    $("local-data-avatar").textContent = copy.avatar;
    $("local-data-public").textContent = copy.publicDevice;
    $("local-data-site-note").textContent = copy.siteNote;
    $("local-data-accounts").textContent = copy.accounts;
    $("local-data-site").textContent = copy.site;
    $("local-data-yes").textContent = copy.yes;
    $("local-data-no").textContent = copy.no;
  }
  let pendingLocalClear = "";
  function askLocalClear(action) {
    const copy = LOCAL_COPY[uiLang === "ko" ? "ko" : "zh"];
    pendingLocalClear = action;
    $("local-data-confirm-text").textContent = action === "site"
      ? copy.site + " " + copy.siteNote
      : copy.accounts;
    $("local-data-confirm").hidden = false;
  }
  $("local-data-accounts").addEventListener("click", () => askLocalClear("accounts"));
  $("local-data-site").addEventListener("click", () => askLocalClear("site"));
  $("local-data-no").addEventListener("click", () => {
    pendingLocalClear = "";
    $("local-data-confirm").hidden = true;
  });
  $("local-data-yes").addEventListener("click", () => {
    if (pendingLocalClear === "accounts") clearLocalAccounts();
    else if (pendingLocalClear === "site") clearAllSiteData();
    pendingLocalClear = "";
    $("local-data-confirm").hidden = true;
  });
  attachMagnet($("btn-clear"), 0.18);
  attachMagnet($("btn-ko"), 0.16);
  attachMagnet($("btn-zh"), 0.16);
  $("form").addEventListener("submit", (e) => { e.preventDefault(); submitAsk($("input").value); });
  $("input").addEventListener("input", () => { resizeInput(); renderGuess(); syncPlaceholder(); });
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitAsk($("input").value); }
  });
  setupAurora();
  setupSpotlights();
  setupTheme();
  setupLangSlider();
  window.addEventListener("resize", syncDock);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", syncDock);
  setLang(uiLang);
  </script>
</body>
</html>
